[project]
name = "discord-notion-sync"
version = "0.1.0"
description = "Production-ready Discord-Notion Bidirectional Task Sync Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "discord.py>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "notion-client>=2.2.1",
    "apscheduler>=3.10.4",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "aiosqlite>=0.22.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
